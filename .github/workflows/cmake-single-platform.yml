name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, Test and SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_SCANNER_VERSION: 5.0.1.3006
      SONAR_SERVER_URL: "https://sonarcloud.io" # Assuming SonarCloud, can be changed if it's a private SonarQube
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            pkg-config \
            libgtkmm-4.0-dev \
            libgtk-layer-shell-dev \
            libcriterion-dev \
            build-essential \
            g++ \
            curl \
            unzip

      - name: Install Sonar Scanner
        run: |
          curl -sSLo /tmp/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux.zip
          sudo unzip -o /tmp/sonar-scanner.zip -d /opt/sonar-scanner
          echo "/opt/sonar-scanner/sonar-scanner-${SONAR_SCANNER_VERSION}-linux/bin" >> $GITHUB_PATH

      - name: Install Build Wrapper
        run: |
          curl -sSLo /tmp/build-wrapper.zip ${{ env.SONAR_SERVER_URL }}/static/cpp/build-wrapper-linux-x86.zip
          sudo unzip -o /tmp/build-wrapper.zip -d /opt/build-wrapper
          echo "/opt/build-wrapper/build-wrapper-linux-x86" >> $GITHUB_PATH

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build with Wrapper
        run: build-wrapper-linux-x86-64 --out-dir bw-output cmake --build build --target Killer unit_tests

      - name: Run Tests
        run: ./build/unit_tests

      - name: SonarQube Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.host.url=${{ env.SONAR_SERVER_URL }}
